services:

  postgres:
    image: postgres:15-alpine
    container_name: strava_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strava_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: strava_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
